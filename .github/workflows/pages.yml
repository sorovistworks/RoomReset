name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # shortcut: Pages is static hosting, so the waitlist API is left out and the form says sign-ups aren't open yet;
      # deploy to a server host (e.g. Vercel) when early-access sign-ups need to be collected.
      - run: rm -rf app/api
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://sorovistworks.github.io/RoomReset
          # Country votes go live once these repository variables are set (public values by design).
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # Next's static export nests prefetch payloads (__next.x/__PAGE__.txt) but the client requests __next.x.__PAGE__.txt.
      - run: find out -path '*/__next.*/__PAGE__.txt' | while read f; do cp "$f" "${f%/__PAGE__.txt}.__PAGE__.txt"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
